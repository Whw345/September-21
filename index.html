<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Flores amarillas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
        <img src="envelope.jpg" alt="Envelope" id="envelope">
        <p>¡Sorpresa! (˶˃ ᵕ ˂˶)</p>
    </div>

    <!-- Letter Screen-->
     <div id="letter-container" style="display: none;">
        <div class="letter-window">
            <h1> id="letter-title">Una flor para otra flor</h1>
            <div class="buttons" id="letter-buttons">
                <img src="open.jpg" class="open-button" alt="Open">

                <div class="no-wrapper">
                    <img src="no.jpg" class="no-button" alt="No">
                </div>
            </div>

            <p id="final-text" class="final-text" style="display: none">
                <strong>Valentine Date:</strong> February 14
            </p>
        </div>
    <script src="script.js"></script>
</body>
</html>
